<main class="page">
  <div class="card">
    <stw-brand-mark heading="Inloggen" />
    <stw-login-form (submitLogin)="handleLogin($event)" [loading]="loading()" />
    @if (errorMessage(); as message) {
      <stw-security-notice variant="error">{{ message }}</stw-security-notice>
    } @else {
      <stw-security-notice variant="info">
        Deze omgeving is uitsluitend voor StemWijzer-beheerders die partijen en stellingen beheren. Log in met het
        account dat je van ProDemos hebt gekregen; nieuwe accounts worden niet zelf aangemaakt.
      </stw-security-notice>
    }
  </div>
  <p class="footer">© {{ currentYear }} ProDemos</p>
</main>
